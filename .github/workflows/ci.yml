name: Verificar proyecto
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --test tests/domain.test.mjs tests/cloud.test.mjs tests/access.test.mjs tests/desktop.test.mjs
      - run: npm run build
